<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title description">
  <title id="title">Three ways to work through a question with AI</title>
  <desc id="description">Choose any row independently. Brainstorm develops options and you choose a direction. Pressure-test examines a proposal and you resolve decisions. Set-goal defines the task and you approve the brief.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="450" rx="16" fill="#f8fafc"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="30" y="40" font-size="23" font-weight="700" fill="#0f172a">Start with the question you have.</text>
    <text x="30" y="67" font-size="16" fill="#475569">Three independent skills. Your judgement stays in the process.</text>
    <g font-size="12" font-weight="700" letter-spacing="1.4" fill="#64748b">
      <text x="48" y="110">YOUR STARTING POINT</text><text x="351" y="110">AI CONTRIBUTION</text><text x="728" y="110">YOUR DECISION</text>
    </g>
    <rect x="28" y="124" width="904" height="90" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="28" y="228" width="904" height="90" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="28" y="332" width="904" height="90" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <g font-size="19" font-weight="600" fill="#0f172a">
      <text x="48" y="163">I need alternatives.</text>
      <text x="48" y="267">I have a proposal.</text>
      <text x="48" y="371">I know the direction.</text>
    </g>
    <g font-size="20" font-weight="700">
      <text x="351" y="157" fill="#1d4ed8">brainstorm</text>
      <text x="351" y="261" fill="#0f766e">pressure-test</text>
      <text x="351" y="365" fill="#9a3412">set-goal</text>
    </g>
    <g font-size="16" fill="#334155">
      <text x="351" y="183">Develop options and trade-offs</text>
      <text x="351" y="287">Examine assumptions and consequences</text>
      <text x="351" y="391">Define the task and success criteria</text>
    </g>
    <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M287 169 H330"/><path d="M287 273 H330"/><path d="M287 377 H330"/>
      <path d="M669 169 H712"/><path d="M669 273 H712"/><path d="M669 377 H712"/>
    </g>
    <g font-size="17" font-weight="600" fill="#0f172a">
      <text x="728" y="164">Choose a direction</text><text x="728" y="268">Resolve the choices</text><text x="728" y="372">Approve the brief</text>
    </g>
    <g font-size="14" fill="#475569">
      <text x="728" y="187">or refine the options</text><text x="728" y="291">or revise the proposal</text><text x="728" y="395">or clarify the scope</text>
    </g>
  </g>
</svg>
