<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="326" viewBox="0 0 1120 326" role="img" aria-labelledby="title description">
  <title id="title">Brainstorm, pressure-test, set-goal</title>
  <desc id="description">Three skills designed to work in sequence, with optional steps. Brainstorm defines the problem area, explores solution options and trade-offs, and sets a direction. Pressure-test challenges assumptions, finds gaps and blind spots to resolve. Set-goal scopes execution: exclusions, sequencing, helper agents, workflow and success criteria.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1120" height="326" rx="16" fill="#ffffff"/>
  <rect x="16" y="20" width="328" height="284" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="396" y="20" width="328" height="284" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <rect x="776" y="20" width="328" height="284" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <g stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M352 78 H385"/>
    <path d="M732 78 H765"/>
  </g>
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="26" font-weight="600">
    <text x="40" y="88" fill="#1d4ed8">/brainstorm</text>
    <text x="420" y="88" fill="#0f766e">/pressure-test</text>
    <text x="800" y="88" fill="#9a3412">/set-goal</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g font-size="23" font-weight="700" fill="#0f172a">
      <text x="40" y="137">Define the objective</text>
      <text x="420" y="137">Stress-test the approach</text>
      <text x="800" y="137">Scope execution</text>
    </g>
    <g font-size="18" fill="#334155">
      <text x="40" y="181">Define the problem area</text>
      <text x="40" y="211">Explore solution options</text>
      <text x="40" y="235">and trade-offs</text>
      <text x="40" y="271">Set a direction</text>
      <text x="420" y="181">Challenge assumptions</text>
      <text x="420" y="211">Find gaps and blind spots</text>
      <text x="420" y="235">to resolve</text>
      <text x="800" y="181">Scope and exclusions</text>
      <text x="800" y="211">Sequencing and use of</text>
      <text x="800" y="235">helper agents</text>
      <text x="800" y="271">Workflow and success criteria</text>
    </g>
  </g>
</svg>
